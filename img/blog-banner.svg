<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="640" viewBox="0 0 1920 640"
     preserveAspectRatio="xMidYMid slice" role="img" aria-label="banner">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#0d151d"/>
      <stop offset="55%"  stop-color="#16222e"/>
      <stop offset="100%" stop-color="#1d3040"/>
    </linearGradient>
    <radialGradient id="glow1" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#00e0b0" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#00e0b0" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#3a7bd5" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#3a7bd5" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M60 0 H0 V60" fill="none" stroke="#ffffff" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1920" height="640" fill="url(#bg)"/>
  <rect width="1920" height="640" fill="url(#grid)"/>

  <!-- 两团柔光，给画面一点层次 -->
  <ellipse cx="380"  cy="180" rx="520" ry="300" fill="url(#glow1)"/>
  <ellipse cx="1560" cy="520" rx="620" ry="340" fill="url(#glow2)"/>

  <!-- 左侧终端提示符水印 -->
  <g opacity="0.10" transform="translate(120,430)">
    <path d="M0 0 L70 60 L0 120" fill="none" stroke="#00e0b0" stroke-width="16"
          stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="100" y="100" width="90" height="18" rx="6" fill="#00e0b0"/>
  </g>

  <!-- 右下角淡淡的扫描线 -->
  <g opacity="0.06">
    <rect x="1200" y="120" width="620" height="2" fill="#ffffff"/>
    <rect x="1200" y="180" width="420" height="2" fill="#ffffff"/>
    <rect x="1200" y="240" width="540" height="2" fill="#ffffff"/>
    <rect x="1200" y="300" width="300" height="2" fill="#ffffff"/>
  </g>

  <!-- 底部压暗一点，让白色标题更清楚 -->
  <rect x="0" y="380" width="1920" height="260" fill="#000000" fill-opacity="0.28"/>
</svg>
