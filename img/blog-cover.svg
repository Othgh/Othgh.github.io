<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450"
     preserveAspectRatio="xMidYMid slice" role="img" aria-label="cover">
  <defs>
    <linearGradient id="cbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"   stop-color="#101a24"/>
      <stop offset="100%" stop-color="#1e3140"/>
    </linearGradient>
    <radialGradient id="cglow" cx="50%" cy="50%" r="50%">
      <stop offset="0%"   stop-color="#00e0b0" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#00e0b0" stop-opacity="0"/>
    </radialGradient>
    <pattern id="cgrid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="800" height="450" fill="url(#cbg)"/>
  <rect width="800" height="450" fill="url(#cgrid)"/>
  <ellipse cx="620" cy="110" rx="300" ry="180" fill="url(#cglow)"/>

  <g opacity="0.5" transform="translate(330,165)">
    <path d="M0 0 L52 60 L0 120" fill="none" stroke="#00e0b0" stroke-width="14"
          stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="74" y="100" width="72" height="16" rx="5" fill="#00e0b0"/>
  </g>
</svg>
